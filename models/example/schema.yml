


version: 2


models:
  - name: stg_sales
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null


      - name: customer_name
        data_tests:
          - not_null


      - name: quantity
        data_tests:
          - not_null


      - name: unit_price
        data_tests:
          - not_null


      - name: sales_amount
        data_tests:
          - not_null

